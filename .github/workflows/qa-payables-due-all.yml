name: Temporary Payables Due All QA

on:
  push:
    branches:
      - fix/payables-due-all-views

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/payables-due-all-views

      - name: Apply patch
        run: python3 .github/qa/patch-payables-due-all.py

      - name: Focused syntax checks
        run: |
          node --check app.js
          grep -q 'data-payables-view="due"' index.html
          grep -q 'data-payables-view="all"' index.html
          grep -q 'shared-trip-r7' service-worker.js

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Mobile browser QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-payables-qa.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node .github/qa/payables-due-all-qa.mjs

      - name: Commit tested production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css service-worker.js
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Add Due and All Payables views"
            git push origin HEAD:fix/payables-due-all-views
          fi
