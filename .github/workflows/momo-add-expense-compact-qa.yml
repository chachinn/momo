name: Momo compact Add Expense QA

on:
  push:
    branches:
      - agent/momo-smart-money-v1-11
    paths:
      - .github/workflows/momo-add-expense-compact-qa.yml

permissions:
  contents: write

jobs:
  compact-add-expense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/momo-smart-money-v1-11
          fetch-depth: 0

      - name: Apply compact Add Expense UX
        shell: python
        run: |
          from pathlib import Path
          import base64

          app_path = Path('app.js')
          app = app_path.read_text()
          anchor = '  converterB:\n    "momo_converter_currency_b",\n'
          replacement = '  converterB:\n    "momo_converter_currency_b",\n\n  expenseCurrency:\n    "momo_expense_last_currency",\n'
          if 'momo_expense_last_currency' not in app:
              if app.count(anchor) != 1: raise SystemExit('expense currency key anchor mismatch')
              app = app.replace(anchor, replacement, 1)

          old = '  if (\n    currencySelect\n  ) {\n\n    currencySelect.value =\n      "PHP";\n\n  }\n'
          new = '  if (\n    currencySelect\n  ) {\n\n    const lastExpenseCurrency =\n      localStorage.getItem(\n        LOCAL_KEYS.expenseCurrency\n      );\n\n    currencySelect.value =\n      lastExpenseCurrency &&\n      EXCHANGE_RATES[\n        lastExpenseCurrency\n      ]\n        ? lastExpenseCurrency\n        : "PHP";\n\n  }\n'
          if 'const lastExpenseCurrency' not in app:
              if app.count(old) != 1: raise SystemExit('default currency anchor mismatch')
              app = app.replace(old, new, 1)

          old = 'currencySelect?.addEventListener(\n  "change",\n  updateExpenseConversion\n);\n'
          new = 'currencySelect?.addEventListener(\n  "change",\n  () => {\n\n    if (\n      currencySelect.value &&\n      EXCHANGE_RATES[\n        currencySelect.value\n      ]\n    ) {\n\n      localStorage.setItem(\n        LOCAL_KEYS.expenseCurrency,\n        currencySelect.value\n      );\n\n    }\n\n    updateExpenseConversion();\n\n  }\n);\n'
          if 'LOCAL_KEYS.expenseCurrency,' not in app:
              if app.count(old) != 1: raise SystemExit('currency listener anchor mismatch')
              app = app.replace(old, new, 1)

          if 'expense-photo-label' not in app:
              old = '      : "📸";'
              new = '      : `<span class="expense-photo-icon" aria-hidden="true">📸</span><span class="expense-photo-label">Add photo</span>`;'
              if app.count(old) != 1: raise SystemExit('photo render anchor mismatch')
              app = app.replace(old, new, 1)
          app_path.write_text(app)

          index_path = Path('index.html')
          html = index_path.read_text()
          old_photo = '''          <section class="photo-upload">\n            <label\n              class="photo-preview"\n              id="photoPreview"\n              for="expensePhoto"\n            >\n              📸\n            </label>\n\n            <label\n              class="photo-add"\n              for="expensePhoto"\n            >\n              <span>＋</span>\n              Add Photo\n            </label>\n\n            <input\n              id="expensePhoto"\n              type="file"\n              accept="image/*"\n              hidden\n            >\n          </section>\n'''
          new_photo = '''          <section class="photo-upload expense-photo-upload">\n            <label\n              class="expense-photo-compact"\n              id="photoPreview"\n              for="expensePhoto"\n              aria-label="Add or change expense photo"\n            >\n              <span class="expense-photo-icon" aria-hidden="true">📸</span>\n              <span class="expense-photo-label">Add photo</span>\n            </label>\n\n            <input\n              id="expensePhoto"\n              type="file"\n              accept="image/*"\n              hidden\n            >\n          </section>\n'''
          if 'class="expense-photo-compact"' not in html:
              if html.count(old_photo) != 1: raise SystemExit('photo HTML anchor mismatch')
              html = html.replace(old_photo, new_photo, 1)

          if 'class="expense-more-details"' not in html:
              start = html.find('            <div class="merchant-memory-field">')
              notes = html.find('            <label class="form-row form-row-notes">', start)
              if start < 0 or notes < 0: raise SystemExit('optional field anchors missing')
              end = html.find('            </label>', notes)
              if end < 0: raise SystemExit('notes end missing')
              end += len('            </label>')
              block = html[start:end]
              indented = '\n'.join('    ' + line if line else line for line in block.split('\n'))
              wrapped = '            <details class="expense-more-details">\n              <summary>\n                <span>More details</span>\n                <small>Location &amp; notes</small>\n              </summary>\n              <div class="expense-more-details-body">\n' + indented + '\n              </div>\n            </details>'
              html = html[:start] + wrapped + html[end:]
          index_path.write_text(html)

          css_path = Path('styles.css')
          css = css_path.read_text()
          if '/* MOMO COMPACT ADD EXPENSE */' not in css:
              css += base64.b64decode('').decode()
          css_path.write_text(css)

      - name: Static safety checks
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check smart-money.js
          node --check scripts/send-reminders.mjs
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'momo_expense_last_currency' app.js
          grep -q 'expense-photo-compact' index.html
          grep -q 'expense-more-details' index.html
          test "$(grep -o 'for="expensePhoto"' index.html | wc -l)" -eq 1
          ! grep -q 'class="photo-add"' index.html
          ! grep -q 'new MutationObserver' smart-money.js
          grep -q 'momo-notifications' firebase-momo.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' firebase-momo.js
          git diff --check

      - name: Browser setup
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Compact mobile Add Expense QA
        run: |
          echo '' | base64 -d > momo-add-expense-qa.mjs
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          node momo-add-expense-qa.mjs

      - name: Clean QA artifacts and publish UX change
        run: |
          rm -rf node_modules
          rm -f momo-add-expense-qa.mjs package.json package-lock.json .github/workflows/momo-add-expense-compact-qa.yml
          test ! -e node_modules
          test ! -e momo-add-expense-qa.mjs
          test ! -e package.json
          test ! -e package-lock.json
          test ! -e .github/workflows/momo-add-expense-compact-qa.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Compact Add Expense and remember currency"
          git push origin HEAD:agent/momo-smart-money-v1-11
