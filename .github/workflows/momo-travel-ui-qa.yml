name: Momo compact travel UI QA

on:
  push:
    branches:
      - ux/trips-compact-travel-ui

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/trips-compact-travel-ui
          fetch-depth: 0

      - name: Apply compact travel UI changes
        run: |
          sed -i "s/styles += r'''/styles += '''/" scripts/momo-travel-ui-patch.py
          python3 scripts/momo-travel-ui-patch.py

      - name: Static safety checks
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check smart-money.js
          node --check scripts/send-reminders.mjs
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'momo-notifications' firebase-momo.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' firebase-momo.js
          grep -q 'function setTravelConverterExpanded' app.js
          grep -q 'converter-side-a' index.html
          grep -q 'converter-side-b' index.html
          grep -Fq 'momo-runtime-shell-v${APP_VERSION}-travel-compact-r1' service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          assert html.count('id="inlineConverter"') == 1
          assert html.count('id="toggleTravelConverter"') == 1
          assert html.index('id="inlineConverter"') < html.index('id="tripList"')
          css = Path('styles.css').read_text()
          assert 'MOMO TRAVEL MODE COMPACT FIRST SCREEN' in css
          assert '\\n.screen[data-screen=' not in css
          PY
          git diff --check

      - name: Browser setup
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Mobile travel QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          node scripts/momo-travel-ui-qa.mjs

      - name: Clean temporary QA and commit production files
        run: |
          rm -rf node_modules
          rm -f package.json package-lock.json
          rm -f scripts/momo-travel-ui-patch.py
          rm -f scripts/momo-travel-ui-qa.mjs
          rm -f .github/workflows/momo-travel-ui-qa.yml
          test ! -e node_modules
          test ! -e package.json
          test ! -e package-lock.json
          test ! -e scripts/momo-travel-ui-patch.py
          test ! -e scripts/momo-travel-ui-qa.mjs
          test ! -e .github/workflows/momo-travel-ui-qa.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Polish compact Trips travel UI"
          git push origin HEAD:ux/trips-compact-travel-ui
