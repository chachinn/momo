name: Momo Smart Money real data QA

on:
  push:
    branches:
      - agent/momo-smart-money-v1-11
    paths:
      - .github/workflows/momo-smart-money-depth-qa.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/momo-smart-money-v1-11
          fetch-depth: 0

      - name: Patch real Momo finance fields
        shell: python
        run: |
          from pathlib import Path
          p = Path('smart-money.js')
          s = p.read_text()
          anchor = '  function computeSafeToSpend(snapshot, now, spend, upcoming) {'
          helper = '''  function protectedJarRemaining(snapshot, now) {
            const key = monthKey(now);
            return savingsGoals(snapshot).reduce((sum, goal) => {
              if (!goal?.protectedJar || num(goal?.monthlyPlan) <= 0) return sum;
              const contributed = (Array.isArray(goal?.contributions) ? goal.contributions : [])
                .filter((item) => text(item?.date).startsWith(key))
                .reduce((amount, item) => amount + num(item?.amount), 0);
              return sum + toPHP(Math.max(0, num(goal.monthlyPlan) - contributed), goal?.currency || "PHP");
            }, 0);
          }

          function computeSafeToSpend(snapshot, now, spend, upcoming) {'''
          if 'function protectedJarRemaining' not in s:
              if anchor not in s: raise SystemExit('Safe-to-Spend anchor missing')
              s = s.replace(anchor, helper, 1)
          s = s.replace('    const protectedSavings = num(plan?.savings);', '    const protectedSavings = Math.max(num(plan?.savings), protectedJarRemaining(snapshot, now));')
          s = s.replace('item?.minimumPayment || item?.dueAmount || item?.paymentAmount || 0', 'item?.regularPayment || item?.minimumDue || item?.minimumPayment || item?.dueAmount || item?.paymentAmount || 0')
          s = s.replace('    const current = num(goal?.currentAmount || goal?.saved || goal?.balance || goal?.progressAmount);', '    const contributed = (Array.isArray(goal?.contributions) ? goal.contributions : []).reduce((sum, item) => sum + num(item?.amount), 0);\n    const current = num(goal?.currentAmount ?? goal?.saved ?? goal?.balance ?? goal?.progressAmount ?? contributed);')
          s = s.replace('      const apr = num(item?.apr || item?.interestRate || item?.rate);', '      const apr = num(item?.interestAPR || item?.apr || item?.interestRate || item?.rate);')
          p.write_text(s)

      - name: Static gates
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check smart-money.js
          node --check scripts/send-reminders.mjs
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'protectedJarRemaining' smart-money.js
          grep -q 'monthlyPlan' smart-money.js
          grep -q 'contributions' smart-money.js
          grep -q 'interestAPR' smart-money.js
          grep -q 'regularPayment' smart-money.js
          grep -q 'minimumDue' smart-money.js
          grep -q 'momo-notifications' firebase-momo.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' firebase-momo.js
          if grep -q 'new MutationObserver' smart-money.js; then exit 1; fi

      - name: Browser setup
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Real populated mobile QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          cat > momo-depth-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page = await context.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.MomoSmartMoney?.version==='1.11.0',null,{timeout:10000});
          await page.evaluate(async()=>{
            const db=await new Promise((res,rej)=>{const r=indexedDB.open('momo_database',4);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
            const names=['expenses','budgets','recurring','planned','cards','settings'];
            for(const name of names){const tx=db.transaction(name,'readwrite');tx.objectStore(name).clear();await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
            const tx=db.transaction(names,'readwrite'); const now=new Date(); const ex=tx.objectStore('expenses');
            const future=(days)=>{const d=new Date(now);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
            for(let i=0;i<2500;i++){const d=new Date(now);d.setDate(d.getDate()-(i%110)-1);ex.put({id:`qa-${i}`,title:i%17===0?'Watsons':`Merchant ${i%70}`,amount:60+(i%700),currency:'PHP',category:i%17===0?'Personal Care':'Food & Drinks',paymentMethod:'Card',date:d.toISOString().slice(0,10)})}
            const today=now.toISOString().slice(0,10);ex.put({id:'dup-a',title:'Cafe Momo',amount:499,currency:'PHP',category:'Food & Drinks',date:today});ex.put({id:'dup-b',title:'Cafe Momo',amount:499,currency:'PHP',category:'Food & Drinks',date:today});
            tx.objectStore('budgets').put({id:'b1',name:'Monthly',amount:80000,currency:'PHP',period:'monthly'});
            tx.objectStore('recurring').put({id:'r1',title:'Internet',amount:1899,currency:'PHP',nextDueDate:future(3),active:true});
            tx.objectStore('planned').put({id:'f1',title:'Headphones',amount:5000,currency:'PHP',targetDate:future(5),status:'planned'});
            tx.objectStore('cards').put({id:'c1',name:'Card A',balance:12000,currency:'PHP',regularPayment:1500,minimumDue:900,interestAPR:24,dueDate:future(4)});
            tx.objectStore('cards').put({id:'c2',name:'Loan B',balance:6000,currency:'PHP',regularPayment:1200,minimumDue:0,interestAPR:8,dueDate:future(6)});
            const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`; const target=new Date(now);target.setMonth(target.getMonth()+6);
            tx.objectStore('settings').put({key:'monthly_income',value:{[key]:100000}});
            tx.objectStore('settings').put({key:'payday_plan_v1',value:{savings:0}});
            tx.objectStore('settings').put({key:'savings_goals',value:[{id:'jar',name:'Japan Jar',targetAmount:30000,currency:'PHP',targetDate:target.toISOString().slice(0,10),jarMode:true,monthlyPlan:5000,protectedJar:true,contributions:[{id:'x',amount:1500,date:`${key}-05`}]}]});
            await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}); db.close();
          });
          const ms = await page.evaluate(async()=>{const t=performance.now();await window.MomoSmartMoney.refresh();return performance.now()-t;});
          const r=await page.evaluate(()=>window.MomoSmartMoney.buildInsights());
          assert.ok(r.insights.length>=3);
          assert.ok(r.safe.protectedAmount>=3500);
          assert.ok(r.upcoming.some(x=>x.name==='Card A'&&x.amount===1500));
          assert.ok(r.insights.some(x=>/Japan Jar/.test(x.title)&&!/₱0\/month/.test(x.title)));
          assert.ok(r.insights.some(x=>/highest-interest/.test(x.body)&&/Card A/.test(x.body)));
          assert.ok(r.insights.some(x=>/Possible duplicate/.test(x.title)));
          assert.ok(r.insights.some(x=>/Headphones/.test(x.title)));
          const ui=await page.evaluate(()=>({safe:document.getElementById('momoSafeToday')?.textContent?.trim(),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,body:document.body.innerText}));
          assert.ok(ui.safe&&ui.safe!=='—');
          assert.ok(ui.overflow<=1);
          assert.doesNotMatch(ui.body,/1\.11\.0(?:-smart-money)?/i);
          assert.ok(ms<2000);
          const tour=page.locator('#welcomeTour');
          if(await tour.count()&&await tour.isVisible()){for(let i=0;i<10&&await tour.isVisible();i++){const bs=tour.locator('button:visible');const pref=bs.filter({hasText:/skip|next|done|finish|start|got it|close/i});await (await pref.count()?pref.last():bs.last()).click();await page.waitForTimeout(50)}}
          for(const target of ['home','budgets','trips','calendar']){const all=page.locator(`[data-nav="${target}"]`);let hit=null;for(let i=0;i<await all.count();i++){const b=await all.nth(i).boundingBox();if(b&&b.x<390&&b.x+b.width>0&&b.y<844&&b.y+b.height>0){hit=all.nth(i);break}}assert.ok(hit);await hit.click();await page.waitForTimeout(50)}
          assert.deepEqual(errors,[]);
          console.log(`PASS real Momo Smart Money QA: 2502 expenses, ${ms.toFixed(1)}ms refresh`);
          await browser.close();
          EOF
          node momo-depth-qa.mjs

      - name: Publish fix and self clean
        run: |
          rm -rf node_modules
          rm -f momo-depth-qa.mjs package.json package-lock.json .momo-smart-qa-trigger .github/workflows/momo-smart-money-depth-qa.yml
          test ! -e node_modules
          test ! -e momo-depth-qa.mjs
          test ! -e package.json
          test ! -e package-lock.json
          test ! -e .momo-smart-qa-trigger
          test ! -e .github/workflows/momo-smart-money-depth-qa.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Align Momo Smart Money with real finance data"
          git push origin HEAD:agent/momo-smart-money-v1-11
