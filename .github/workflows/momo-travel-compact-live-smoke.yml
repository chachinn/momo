name: Momo compact travel live smoke

on:
  push:
    branches:
      - ux/trips-compact-travel-ui

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/trips-compact-travel-ui
          fetch-depth: 0

      - name: Verify deployed compact Trips UX
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > /tmp/main-index.html
          git show origin/main:app.js > /tmp/main-app.js
          git show origin/main:styles.css > /tmp/main-styles.css
          git show origin/main:service-worker.js > /tmp/main-sw.js

          BASE="https://chachinn.github.io/momo"
          Q="?compact_smoke=${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --location --retry 3 "$BASE/index.html$Q" -o /tmp/live-index.html
          curl --fail --silent --show-error --location --retry 3 "$BASE/app.js$Q" -o /tmp/live-app.js
          curl --fail --silent --show-error --location --retry 3 "$BASE/styles.css$Q" -o /tmp/live-styles.css
          curl --fail --silent --show-error --location --retry 3 "$BASE/service-worker.js$Q" -o /tmp/live-sw.js

          cmp /tmp/main-index.html /tmp/live-index.html
          cmp /tmp/main-app.js /tmp/live-app.js
          cmp /tmp/main-styles.css /tmp/live-styles.css
          cmp /tmp/main-sw.js /tmp/live-sw.js

          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/live-index.html').read_text()
          app = Path('/tmp/live-app.js').read_text()
          css = Path('/tmp/live-styles.css').read_text()
          sw = Path('/tmp/live-sw.js').read_text()

          assert html.index('id="inlineConverter"') < html.index('id="tripList"')
          assert 'id="toggleTravelConverter"' in html
          assert 'converter-side-a' in html
          assert 'converter-side-b' in html
          assert 'function setTravelConverterExpanded' in app
          assert 'trip-quick-expense-btn' in app
          card_start = app.index('function createTripCardHTML(')
          card_end = app.index('// ========================================\n// RENDER TRIPS', card_start)
          card = app[card_start:card_end]
          assert card.index('trip-quick-expense-btn') < card.index('trip-dashboard-open')
          assert 'MOMO TRAVEL MODE COMPACT FIRST SCREEN' in css
          assert '#inlineConverter:not(.is-expanded)' in css
          assert 'momo-runtime-shell-v${APP_VERSION}-travel-compact-r1' in sw
          print('PASS live compact Trips UX')
          PY

      - name: Self-clean smoke workflow
        if: always()
        run: |
          rm -f .github/workflows/momo-travel-compact-live-smoke.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Remove temporary compact travel live smoke"
            git push origin HEAD:ux/trips-compact-travel-ui
          fi
