name: Momo generic trip sharing copy
on:
  push:
    branches: [fix/generic-trip-sharing-copy]
permissions:
  contents: write
jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generic-trip-sharing-copy
          fetch-depth: 0

      - name: Make trip sharing copy reusable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          share = Path('trip-sharing.js')
          text = share.read_text()
          replacements = {
            'Share with Martin': 'Share invite',
            'Martin will be able to add, edit and delete expenses linked to': 'Your travel partner will be able to add, edit and delete expenses linked to',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'Missing trip-sharing copy anchor: {before}')
              text = text.replace(before, after)
          share.write_text(text)

          firebase = Path('firebase-momo.js')
          text = firebase.read_text()
          before = 'Open this trip invite on Martin’s Momo account, not the account that created it.'
          after = 'Open this trip invite on your travel partner’s Momo account, not the account that created it.'
          if before not in text:
              raise SystemExit('Missing Firebase Martin copy anchor')
          firebase.write_text(text.replace(before, after))

          sw = Path('service-worker.js')
          text = sw.read_text()
          before = 'momo-runtime-shell-v${APP_VERSION}-shared-trip-r1'
          after = 'momo-runtime-shell-v${APP_VERSION}-shared-trip-r2'
          if before not in text:
              raise SystemExit('Missing service-worker cache anchor')
          sw.write_text(text.replace(before, after))
          PY

      - name: Validate copy and architecture
        run: |
          node --check trip-sharing.js
          node --check firebase-momo.js
          node --check service-worker.js
          grep -q '>Share invite</button>' trip-sharing.js
          grep -q 'Your travel partner will be able to add, edit and delete expenses linked to' trip-sharing.js
          grep -q 'your travel partner’s Momo account' firebase-momo.js
          ! grep -q 'Martin' trip-sharing.js
          ! grep -q 'Martin' firebase-momo.js
          grep -Fq 'momo-runtime-shell-v${APP_VERSION}-shared-trip-r2' service-worker.js
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'momo-notifications' firebase-momo.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' firebase-momo.js
          grep -q '"./trip-sharing.js"' service-worker.js
          git diff --check

      - name: Commit production-only fix
        run: |
          rm -f .github/workflows/momo-generic-trip-share-copy.yml
          test ! -e .github/workflows/momo-generic-trip-share-copy.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Make shared trip invite copy generic"
          git push origin HEAD:fix/generic-trip-sharing-copy
