name: Temporary Payables Monthly QA

on:
  push:
    branches:
      - fix/payables-monthly-focus

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/payables-monthly-focus
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/qa/patch-payables-monthly-focus.py

      - name: Syntax checks
        run: |
          node --check app.js
          node --check smart-money.js
          node --check service-worker.js
          grep -F 'function getPayableNextPaymentAmount(payable)' app.js
          grep -F 'getMomoTodaySnapshot({ includePayables: showPayablesOnHome })' app.js
          grep -F 'Remaining balance' app.js
          grep -F 'Next payments' index.html
          grep -F 'shared-trip-r5' service-worker.js

      - name: Install browser
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Browser QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          npx -y -p playwright@1.55.0 node .github/qa/payables-monthly-focus-qa.mjs

      - name: Commit tested production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css smart-money.js service-worker.js
          git commit -m "Focus payables on next payment amounts"
          git push origin HEAD:fix/payables-monthly-focus
