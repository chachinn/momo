name: Temporary Monthly Payable Checkoff QA

on:
  push:
    branches:
      - feat/payables-monthly-checkoff

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/payables-monthly-checkoff
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/qa/patch-payables-monthly-checkoff.py

      - name: Syntax and focused checks
        run: |
          node --check app.js
          node --check smart-money.js
          grep -F 'showPayablesOnHome: true' app.js
          grep -F 'showPayablesOnHome: setting.showPayablesOnHome !== false' app.js
          grep -F 'isPayableWaitingInMonth' app.js
          grep -F 'data-payable-month-toggle' app.js
          grep -F 'source: "month-check"' app.js
          grep -F 'Still to pay this month' index.html
          grep -F 'shared-trip-r6' service-worker.js

      - name: Install browser
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Mobile browser QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          mkdir -p /tmp/momo-playwright
          cp .github/qa/payables-monthly-checkoff-qa.mjs /tmp/momo-playwright/qa.mjs
          cd /tmp/momo-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          node qa.mjs

      - name: Commit tested production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html smart-money.js styles.css service-worker.js
          git commit -m "Add monthly payable checkoff"
          git push origin HEAD:feat/payables-monthly-checkoff
