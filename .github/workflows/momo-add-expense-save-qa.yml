name: Momo Add Expense save-action QA

on:
  push:
    branches:
      - fix/add-expense-save-action

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/add-expense-save-action
          fetch-depth: 0

      - name: Apply UI hierarchy fix
        run: python3 scripts/momo-add-expense-save-patch.py

      - name: Static safety checks
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check smart-money.js
          node --check scripts/send-reminders.mjs
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'momo-notifications' firebase-momo.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' firebase-momo.js
          grep -q 'Save Expense' index.html
          grep -q 'saveExpenseTop' index.html
          grep -q 'Save as Template' index.html
          grep -Fq 'momo-runtime-shell-v${APP_VERSION}-save-action-r1' service-worker.js
          git diff --check

      - name: Browser setup
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Mobile Add Expense QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          node scripts/momo-add-expense-save-qa.mjs

      - name: Clean and commit production files
        run: |
          rm -rf node_modules
          rm -f package.json package-lock.json
          rm -f scripts/momo-add-expense-save-patch.py
          rm -f scripts/momo-add-expense-save-qa.mjs
          rm -f .github/workflows/momo-add-expense-save-qa.yml
          test ! -e node_modules
          test ! -e package.json
          test ! -e package-lock.json
          test ! -e scripts/momo-add-expense-save-patch.py
          test ! -e scripts/momo-add-expense-save-qa.mjs
          test ! -e .github/workflows/momo-add-expense-save-qa.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Fix Add Expense save action hierarchy"
          git push origin HEAD:fix/add-expense-save-action
