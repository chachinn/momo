name: Momo Smart Money final integration QA

on:
  push:
    branches:
      - agent/momo-smart-money-v1-11
    paths:
      - .github/workflows/momo-smart-money-final-qa.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/momo-smart-money-v1-11
          fetch-depth: 0

      - name: Reuse Momo currency conversion
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('smart-money.js')
          s = p.read_text()

          s, rates_removed = re.subn(
              r'\n  const RATES = \{.*?\n  \};\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if rates_removed != 1:
              raise SystemExit('Expected Smart Money RATES block was not found exactly once')

          old = '''  const toPHP = (amount, currency = "PHP") => {
    const rate = RATES[text(currency).toUpperCase()] || 1;
    return num(amount) / rate;
  };'''
          new = '''  const toPHP = (amount, currency = "PHP") => {
    const code = text(currency).toUpperCase() || "PHP";
    if (typeof window.convertCurrency !== "function") {
      throw new Error("Momo currency converter is unavailable.");
    }
    return num(window.convertCurrency(num(amount), code, "PHP"));
  };'''

          if s.count(old) != 1:
              raise SystemExit('Expected Smart Money toPHP helper was not found exactly once')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Static safety gates
        run: |
          node --check app.js
          node --check firebase-momo.js
          node --check service-worker.js
          node --check smart-money.js
          node --check scripts/send-reminders.mjs
          grep -q 'const DB_VERSION = 4;' app.js
          grep -q 'window.convertCurrency' smart-money.js
          grep -q 'protectedJarRemaining' smart-money.js
          grep -q 'monthlyPlan' smart-money.js
          grep -q 'contributions' smart-money.js
          grep -q 'interestAPR' smart-money.js
          grep -q 'regularPayment' smart-money.js
          grep -q 'minimumDue' smart-money.js
          grep -q 'momo-notifications' firebase-momo.js
          grep -q 'CLOUD_AUTO_BACKUP_HOUR = 8' firebase-momo.js
          grep -q 'smart-money.js' index.html
          grep -q 'smart-money.js' service-worker.js
          if grep -q 'const RATES' smart-money.js; then exit 1; fi
          if grep -q 'new MutationObserver' smart-money.js; then exit 1; fi

      - name: Browser setup
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Real populated mobile QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          cat > momo-final-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(String(error)));

          await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
          await page.waitForFunction(() => window.MomoSmartMoney?.version === '1.11.0', null, { timeout: 10000 });

          const converterReady = await page.evaluate(() => typeof window.convertCurrency === 'function');
          assert.equal(converterReady, true);

          await page.evaluate(async () => {
            const db = await new Promise((resolve, reject) => {
              const request = indexedDB.open('momo_database', 4);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });

            const names = ['expenses', 'budgets', 'recurring', 'planned', 'cards', 'settings'];
            for (const name of names) {
              const tx = db.transaction(name, 'readwrite');
              tx.objectStore(name).clear();
              await new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
              });
            }

            const tx = db.transaction(names, 'readwrite');
            const now = new Date();
            const expenses = tx.objectStore('expenses');
            const future = (days) => {
              const d = new Date(now);
              d.setDate(d.getDate() + days);
              return d.toISOString().slice(0, 10);
            };

            for (let i = 0; i < 2500; i += 1) {
              const d = new Date(now);
              d.setDate(d.getDate() - (i % 110) - 1);
              expenses.put({
                id: `qa-${i}`,
                title: i % 17 === 0 ? 'Watsons' : `Merchant ${i % 70}`,
                amount: 60 + (i % 700),
                currency: 'PHP',
                category: i % 17 === 0 ? 'Personal Care' : 'Food & Drinks',
                paymentMethod: 'Card',
                date: d.toISOString().slice(0, 10)
              });
            }

            const today = now.toISOString().slice(0, 10);
            expenses.put({ id: 'dup-a', title: 'Cafe Momo', amount: 499, currency: 'PHP', category: 'Food & Drinks', date: today });
            expenses.put({ id: 'dup-b', title: 'Cafe Momo', amount: 499, currency: 'PHP', category: 'Food & Drinks', date: today });

            tx.objectStore('budgets').put({ id: 'b1', name: 'Monthly', amount: 80000, currency: 'PHP', period: 'monthly' });
            tx.objectStore('recurring').put({ id: 'r1', title: 'Internet', amount: 1899, currency: 'PHP', nextDueDate: future(3), active: true });
            tx.objectStore('recurring').put({ id: 'fx1', title: 'FX Test', amount: 2560, currency: 'JPY', nextDueDate: future(2), active: true });
            tx.objectStore('planned').put({ id: 'f1', title: 'Headphones', amount: 5000, currency: 'PHP', targetDate: future(5), status: 'planned' });
            tx.objectStore('cards').put({ id: 'c1', name: 'Card A', balance: 12000, currency: 'PHP', regularPayment: 1500, minimumDue: 900, interestAPR: 24, dueDate: future(4) });
            tx.objectStore('cards').put({ id: 'c2', name: 'Loan B', balance: 6000, currency: 'PHP', regularPayment: 1200, minimumDue: 0, interestAPR: 8, dueDate: future(6) });

            const key = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const target = new Date(now);
            target.setMonth(target.getMonth() + 6);
            tx.objectStore('settings').put({ key: 'monthly_income', value: { [key]: 100000 } });
            tx.objectStore('settings').put({ key: 'payday_plan_v1', value: { savings: 0 } });
            tx.objectStore('settings').put({
              key: 'savings_goals',
              value: [{
                id: 'jar',
                name: 'Japan Jar',
                targetAmount: 30000,
                currency: 'PHP',
                targetDate: target.toISOString().slice(0, 10),
                jarMode: true,
                monthlyPlan: 5000,
                protectedJar: true,
                contributions: [{ id: 'x', amount: 1500, date: `${key}-05` }]
              }]
            });

            await new Promise((resolve, reject) => {
              tx.oncomplete = resolve;
              tx.onerror = () => reject(tx.error);
            });
            db.close();
          });

          const ms = await page.evaluate(async () => {
            const start = performance.now();
            await window.MomoSmartMoney.refresh();
            return performance.now() - start;
          });

          const result = await page.evaluate(() => window.MomoSmartMoney.buildInsights());
          const expectedFx = await page.evaluate(() => window.convertCurrency(2560, 'JPY', 'PHP'));
          const fxItem = result.upcoming.find((item) => item.name === 'FX Test');

          assert.ok(result.insights.length >= 3);
          assert.ok(result.safe.protectedAmount >= 3500);
          assert.ok(result.upcoming.some((item) => item.name === 'Card A' && item.amount === 1500));
          assert.ok(fxItem && Math.abs(fxItem.amount - expectedFx) < 0.001);
          assert.ok(result.insights.some((item) => /Japan Jar/.test(item.title) && !/₱0\/month/.test(item.title)));
          assert.ok(result.insights.some((item) => /highest-interest/.test(item.body) && /Card A/.test(item.body)));
          assert.ok(result.insights.some((item) => /Possible duplicate/.test(item.title)));
          assert.ok(result.insights.some((item) => /Headphones/.test(item.title)));

          const ui = await page.evaluate(() => ({
            safe: document.getElementById('momoSafeToday')?.textContent?.trim(),
            overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
            body: document.body.innerText
          }));
          assert.ok(ui.safe && ui.safe !== '—');
          assert.ok(ui.overflow <= 1);
          assert.doesNotMatch(ui.body, /1\.11\.0(?:-smart-money)?/i);
          assert.ok(ms < 2000);

          const tour = page.locator('#welcomeTour');
          if (await tour.count() && await tour.isVisible()) {
            for (let i = 0; i < 10 && await tour.isVisible(); i += 1) {
              const buttons = tour.locator('button:visible');
              const preferred = buttons.filter({ hasText: /skip|next|done|finish|start|got it|close/i });
              await (await preferred.count() ? preferred.last() : buttons.last()).click();
              await page.waitForTimeout(50);
            }
          }

          for (const target of ['home', 'budgets', 'trips', 'calendar']) {
            const all = page.locator(`[data-nav="${target}"]`);
            let hit = null;
            for (let i = 0; i < await all.count(); i += 1) {
              const box = await all.nth(i).boundingBox();
              if (box && box.x < 390 && box.x + box.width > 0 && box.y < 844 && box.y + box.height > 0) {
                hit = all.nth(i);
                break;
              }
            }
            assert.ok(hit);
            await hit.click();
            await page.waitForTimeout(50);
          }

          assert.deepEqual(errors, []);
          console.log(`PASS final Momo Smart Money QA: 2502 expenses, FX linked, ${ms.toFixed(1)}ms refresh`);
          await browser.close();
          EOF
          node momo-final-qa.mjs

      - name: Clean and publish production-only patch
        run: |
          rm -rf node_modules
          rm -f momo-final-qa.mjs package.json package-lock.json .github/workflows/momo-smart-money-final-qa.yml
          test ! -e node_modules
          test ! -e momo-final-qa.mjs
          test ! -e package.json
          test ! -e package-lock.json
          test ! -e .github/workflows/momo-smart-money-final-qa.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)node_modules/|(^|/)package(-lock)?\.json$|momo-final-qa\.mjs'; then exit 1; fi
          git status --short
          git commit -m "Use Momo currency conversion in Smart Money"
          git push origin HEAD:agent/momo-smart-money-v1-11
