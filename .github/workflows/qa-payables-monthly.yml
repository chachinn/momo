name: Temporary Payables Monthly QA

on:
  push:
    branches:
      - feat/payables-flexible-monthly-v2

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/payables-flexible-monthly-v2

      - name: Apply combined patch
        run: |
          python3 .github/qa/patch-payables-monthly.py
          python3 .github/qa/patch-payables-monthly-fix.py

      - name: Focused syntax checks
        run: |
          node --check app.js
          grep -q 'id="payablePaymentMode"' index.html
          grep -q 'id="payableRemainingMonths"' index.html
          grep -q 'id="payablePaymentsCompleted"' index.html
          grep -q 'id="payablePaymentsTotal"' index.html
          grep -q 'id="payableStatementReminder"' index.html
          grep -q 'payables-monthly-r2' service-worker.js

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Mobile browser QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-payables-monthly.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node .github/qa/payables-monthly-qa.mjs

      - name: Commit tested production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css service-worker.js
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Add flexible monthly payable setup"
            git push origin HEAD:feat/payables-flexible-monthly-v2
          fi
