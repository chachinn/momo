name: Momo shared trip inspection
on:
  push:
    branches: [feature/shared-trip-expenses]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-trip-expenses
          fetch-depth: 0
      - name: Inspect integration anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text().splitlines()
          needles=['// SAVE EXPENSE','const expense = {','deleteExpense','expenseDetailDelete','createTripCardHTML','tripForm?.addEventListener','tripForm.addEventListener']
          for needle in needles:
              print('\n===', needle, '===')
              hits=[i for i,l in enumerate(text) if needle in l]
              for i in hits[:5]:
                  a=max(0,i-25); b=min(len(text),i+100)
                  print(f'--- lines {a+1}-{b} ---')
                  print('\n'.join(f'{j+1}: {text[j]}' for j in range(a,b)))
          html=Path('index.html').read_text().splitlines()
          for needle in ['id="tripList"','firebase-momo.js','app.js','service-worker.js']:
              print('\n=== HTML',needle,'===')
              hits=[i for i,l in enumerate(html) if needle in l]
              for i in hits[:3]:
                  a=max(0,i-15); b=min(len(html),i+35)
                  print('\n'.join(f'{j+1}: {html[j]}' for j in range(a,b)))
          PY
      - name: Self-clean
        run: |
          rm -f .github/workflows/momo-trip-share-inspect.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary shared trip inspection workflow"
          git push origin HEAD:feature/shared-trip-expenses
