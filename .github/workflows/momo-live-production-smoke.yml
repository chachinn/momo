name: Momo live production smoke

on:
  push:
    branches:
      - agent/momo-smart-money-v1-11
    paths:
      - .github/workflows/momo-live-production-smoke.yml

permissions:
  contents: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/momo-smart-money-v1-11
          fetch-depth: 0

      - name: Verify live GitHub Pages files
        run: |
          set -euo pipefail
          BASE="https://chachinn.github.io/momo"
          CACHE_BUST="?smoke=${GITHUB_RUN_ID}"

          curl --fail --silent --show-error --location --retry 3 "$BASE/index.html$CACHE_BUST" -o /tmp/live-index.html
          curl --fail --silent --show-error --location --retry 3 "$BASE/app.js$CACHE_BUST" -o /tmp/live-app.js
          curl --fail --silent --show-error --location --retry 3 "$BASE/styles.css$CACHE_BUST" -o /tmp/live-styles.css
          curl --fail --silent --show-error --location --retry 3 "$BASE/service-worker.js$CACHE_BUST" -o /tmp/live-service-worker.js
          curl --fail --silent --show-error --location --retry 3 "$BASE/smart-money.js$CACHE_BUST" -o /tmp/live-smart-money.js

          cmp index.html /tmp/live-index.html
          cmp app.js /tmp/live-app.js
          cmp styles.css /tmp/live-styles.css
          cmp service-worker.js /tmp/live-service-worker.js
          cmp smart-money.js /tmp/live-smart-money.js

          grep -q 'expense-photo-compact' /tmp/live-index.html
          grep -q 'expense-more-details' /tmp/live-index.html
          grep -q 'smart-money.js' /tmp/live-index.html
          test "$(grep -o 'for="expensePhoto"' /tmp/live-index.html | wc -l)" -eq 1
          ! grep -q 'class="photo-add"' /tmp/live-index.html
          grep -q 'momo_expense_last_currency' /tmp/live-app.js
          grep -q 'const DB_VERSION = 4;' /tmp/live-app.js
          grep -q 'window.convertCurrency' /tmp/live-smart-money.js
          ! grep -q 'const RATES' /tmp/live-smart-money.js
          ! grep -q 'new MutationObserver' /tmp/live-smart-money.js
          grep -q 'smart-money.js' /tmp/live-service-worker.js

          echo "PASS live Momo production smoke: deployed files match tested release files"

      - name: Self-clean smoke workflow
        run: |
          rm -f .github/workflows/momo-live-production-smoke.yml
          git config user.name "Momo Release Bot"
          git config user.email "momo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary live production smoke test"
          git push origin HEAD:agent/momo-smart-money-v1-11
