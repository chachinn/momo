name: Temporary Home payables privacy QA

on:
  push:
    branches:
      - ux/home-payables-privacy

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ux/home-payables-privacy
          fetch-depth: 0

      - name: Apply focused Home privacy change
        run: python .github/qa/patch-home-payables-privacy.py

      - name: Syntax and focused checks
        shell: bash
        run: |
          node --check app.js
          node --check smart-money.js
          node --check service-worker.js
          grep -F 'showPayablesOnHome: false' app.js
          grep -F 'data-momo-home-payables-visible' index.html
          grep -F 'showPayablesOnHome && debt && debt.count > 0' smart-money.js
          grep -F 'shared-trip-r4' service-worker.js

      - name: Commit tested production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html smart-money.js service-worker.js
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Add Home payables privacy control"
          git push origin HEAD:ux/home-payables-privacy
