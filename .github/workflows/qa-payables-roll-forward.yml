name: Temporary Rolling Due Cycle QA

on:
  push:
    branches:
      - fix/payables-roll-forward-due-cycle
    paths:
      - .github/workflows/qa-payables-roll-forward.yml
      - .github/qa/payables-roll-forward.spec.mjs

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payables-roll-forward-due-cycle
      - name: Syntax checks
        run: |
          node --check app.js
          node --check service-worker.js
          grep -q 'getPayablesDueCycleMonthKey' app.js
          grep -q 'payables-planner-r8' service-worker.js
          grep -q 'DB_VERSION = 4' app.js
      - name: Install Playwright
        run: |
          mkdir -p /tmp/momo-playwright
          cd /tmp/momo-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Mobile browser QA
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          ln -s /tmp/momo-playwright/node_modules node_modules
          node .github/qa/payables-roll-forward.spec.mjs
