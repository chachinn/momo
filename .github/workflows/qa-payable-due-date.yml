name: Temporary payable due date QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: payable-due-date-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-and-qa:
    if: github.event.pull_request.head.ref == 'fix/payable-recurring-due-date'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused payable fix
        run: python .github/qa/patch-payable.py

      - name: Syntax and architecture checks
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          grep -F 'const DB_VERSION = 4;' app.js
          grep -F 'function getPayableDueDay(dateString)' app.js
          grep -F 'record.dueDayOfMonth =' app.js
          grep -F 'shared-trip-r3' service-worker.js
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2
          test -f .github/workflows/momo-reminders.yml

      - name: Install browser QA dependency outside repository
        shell: bash
        run: |
          rm -rf /tmp/momo-playwright
          mkdir -p /tmp/momo-playwright
          npm install --prefix /tmp/momo-playwright @playwright/test@1.55.0
          /tmp/momo-playwright/node_modules/.bin/playwright install chromium

      - name: Mobile browser QA
        shell: bash
        env:
          NODE_PATH: /tmp/momo-playwright/node_modules
        run: |
          python3 -m http.server 4173 >/tmp/momo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          /tmp/momo-playwright/node_modules/.bin/playwright test .github/qa/payable.spec.js --reporter=line --workers=1

          trap - EXIT
          kill $SERVER_PID || true

      - name: Commit tested production changes
        shell: bash
        run: |
          if git diff --quiet -- app.js service-worker.js; then
            echo 'Payable patch already present; nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js service-worker.js
          git commit -m 'Fix payable due date recurrence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
