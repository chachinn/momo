name: Temporary Momo Daily Budgets QA
on:
  push:
    branches: [feat/trip-custom-daily-budgets-20261017]
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-trip-daily-budgets.cjs
